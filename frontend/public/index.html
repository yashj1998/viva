<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ViVA — Live Better</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f3efe3;
      color: #16261d;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
    }
    .splash-card {
      background: #ffffff;
      border-radius: 28px;
      padding: 40px 28px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 40px -15px rgba(18, 53, 36, 0.08);
      border: 1px solid rgba(18, 53, 36, 0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo-badge {
      width: 76px;
      height: 76px;
      border-radius: 22px;
      background: #123524;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 10px 20px -5px rgba(18, 53, 36, 0.25);
    }
    .logo-badge img {
      width: 44px;
      height: 44px;
      object-fit: contain;
    }
    .logo-badge svg {
      width: 40px;
      height: 40px;
      fill: #ffffff;
    }
    .brand-title {
      font-family: 'Poppins', sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: #123524;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .tagline {
      font-size: 14px;
      font-weight: 500;
      color: #3e8a5f;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 24px;
    }
    .status-container {
      margin-top: 10px;
      width: 100%;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #eef1e6;
      border-top-color: #123524;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-text {
      font-size: 14px;
      color: #6b7280;
      line-height: 1.5;
    }
    .retry-btn {
      display: none;
      margin-top: 20px;
      background: #123524;
      color: #ffffff;
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      font-weight: 600;
      padding: 12px 28px;
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(18, 53, 36, 0.2);
      transition: all 0.2s ease;
    }
    .retry-btn:active {
      transform: scale(0.98);
      background: #0d2a1c;
    }
    .footer-note {
      margin-top: 24px;
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="splash-card">
    <div class="logo-badge">
      <img src="images/viva-logo.png" alt="ViVA Logo" onerror="this.style.display='none'; document.getElementById('fallback-icon').style.display='block';">
      <svg id="fallback-icon" style="display:none;" viewBox="0 0 24 24">
        <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
      </svg>
    </div>
    <h1 class="brand-title">ViVA</h1>
    <p class="tagline">Live Better</p>
    
    <div class="status-container">
      <div class="spinner" id="spinner"></div>
      <p class="status-text" id="status-text">Connecting to ViVA Storefront...</p>
      <button class="retry-btn" id="retry-btn" onclick="retryConnection()">Retry Connection</button>
    </div>
  </div>

  <p class="footer-note">Smart Shopping for Modern Living</p>

  <script>
    // The target server URL (can be updated when deployed)
    const TARGET_URL = window.VIVA_SERVER_URL || null;

    function checkConnection() {
      if (TARGET_URL && window.location.href !== TARGET_URL) {
        document.getElementById('status-text').textContent = 'Opening ViVA Store...';
        window.location.replace(TARGET_URL);
      } else {
        // Standalone offline shell presentation
        setTimeout(() => {
          document.getElementById('spinner').style.display = 'none';
          document.getElementById('status-text').textContent = 'Ready to connect to live storefront server.';
          document.getElementById('retry-btn').style.display = 'inline-block';
          document.getElementById('retry-btn').textContent = 'Connect';
        }, 1200);
      }
    }

    function retryConnection() {
      document.getElementById('spinner').style.display = 'block';
      document.getElementById('retry-btn').style.display = 'none';
      document.getElementById('status-text').textContent = 'Reconnecting...';
      setTimeout(checkConnection, 1000);
    }

    window.addEventListener('DOMContentLoaded', checkConnection);
  </script>
</body>
</html>
